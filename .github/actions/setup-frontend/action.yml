name: 'Install Studio frontend dependencies'
description: 'Install the pinned Node.js/pnpm toolchain and Studio web dependencies'

runs:
  using: composite
  steps:
    - name: Cache Studio pnpm store
      uses: actions/cache@v6.0.0
      with:
        path: |
          ~/.local/share/pnpm/store
          ~/.cache/pnpm
        key: pnpm-studio-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-studio-${{ runner.os }}-

    - uses: actions/setup-node@v4
      with:
        node-version: '24.11.1'

    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.9

    - name: Install Studio frontend dependencies
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
