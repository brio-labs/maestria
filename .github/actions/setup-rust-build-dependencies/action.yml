name: 'Install Rust and Linux build dependencies'
description: 'Install the linker and GTK3/WebKitGTK build toolchain required by Maestria'

inputs:
  native-test:
    description: 'Install the additional display and WebKitWebDriver packages used by native launcher checks'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      uses: ./.github/actions/setup-system-dependencies
      with:
        native-test: ${{ inputs.native-test }}
    - name: Install mold and clang
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends clang mold
