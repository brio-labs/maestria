name: 'Install Sillage Linux build dependencies'
description: 'Install GLib/GIO and native display dependencies required by the workspace on Ubuntu'

inputs:
  native-test:
    description: 'Install isolated X11, D-Bus, and AT-SPI packages used by native launcher smoke checks'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install native Linux build packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libglib2.0-dev \
          libfontconfig-dev \
          pkg-config \
          libssl-dev
    - name: Install native launcher X11 and accessibility packages
      if: inputs.native-test == 'true'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          xvfb xauth dbus-x11 libglib2.0-bin \
          xdotool jwm x11-utils python3-gi gir1.2-atspi-2.0 at-spi2-core
