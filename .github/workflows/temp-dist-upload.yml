name: temp-dist-upload
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/brio-labs/maestria/ci:nightly-2026-06-15
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Trust workspace for git
        run: git config --global --add safe.directory '*'
      - name: Install Studio frontend dependencies
        run: corepack pnpm@9.15.9 --dir web install --frozen-lockfile
      - name: Build Studio frontend
        env:
          RUSTC_WRAPPER: ""
        run: corepack pnpm@9.15.9 --dir web build
      - name: Upload built dist
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist-ci
          path: web/dist
          if-no-files-found: error
