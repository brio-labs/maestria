[package]
name = "sillage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sillage Linux-first launcher and extension platform with local semantic search"
publish = false

[workspace]
resolver = "2"
exclude = ["vendor/global-hotkey", "vendor/accesskit_unix"]
members = [
    "web",
    "crates/apps/sillage-daemon",
    "crates/apps/sillage-studio",
    "crates/apps/sillage-cli",
    "crates/apps/sillage-search",
    "crates/apps/sillage-launcher",
    "crates/apps/sillage-extension-worker",
     "crates/core/sillage-core",
     "crates/ecosystem/sillage-memory",
     "crates/ecosystem/sillage-code-intel",
     "crates/ecosystem/sillage-parsers",
     "crates/ecosystem/sillage-index-selection",
     "crates/ecosystem/sillage-validation",
     "crates/ecosystem/sillage-web-evidence",
    "crates/ecosystem/sillage-extensions",
     "crates/harness/sillage-harness",
     "crates/ecosystem/sillage-retrieval",
     "crates/harness/sillage-harness-cli",
     "crates/kernel/sillage-domain",
     "crates/kernel/sillage-governance",
     "crates/kernel/sillage-ports",
     "crates/runtime/sillage-runtime",
     "crates/storage/sillage-blob-fs",
     "crates/storage/sillage-search-tantivy",
     "crates/storage/sillage-storage-sqlite",
     "crates/storage/sillage-vector-sqlite",
     "crates/storage/sillage-graph-sqlite",
    "crates/ecosystem/sillage-adapter-http",
    "crates/ecosystem/sillage-ocr-local",
     "crates/ecosystem/sillage-embedding-openai",
     "crates/ecosystem/sillage-visual-local",
     "crates/ecosystem/sillage-sparse-local",
     "crates/test-support/sillage-test-support",
 ]

[patch.crates-io]
# global-hotkey 0.8.0 otherwise leaves X11 ungrabs buffered after unregister.
global-hotkey = { path = "vendor/global-hotkey" }
# accesskit_unix 0.22.1 emits cache signals without the D-Bus argument tuple
# and can unregister a live object when Slint reuses its node ID before queued
# accessibility lifecycle messages are processed.
accesskit_unix = { path = "vendor/accesskit_unix" }

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.53" }
tokio-util = "0.7.19"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
url = "2"
tempfile = "3"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
ignore = "0.4.28"
getrandom = "0.4"
base64 = "0.22"
lopdf = "0.42"
tantivy = "0.26"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
toml = "0.8"
regex = "1"
libc = "0.2"
mime_guess = "2.0.5"
axum = "0.8.9"
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.7.0", features = ["limit", "set-header", "timeout", "trace"] }
rust-embed = "8.7"
gloo-net = "0.7.0"
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"
web-sys = { version = "0.3.103", features = ["Document", "Element", "History", "HtmlDialogElement", "HtmlElement", "Location", "Storage", "Window"] }
pulldown-cmark = "0.13.4"
dioxus = { version = "0.7.10", features = ["web", "router"] }
insta = { version = "1", features = ["yaml"] }

# Internal
sillage-core = { path = "crates/core/sillage-core" }
sillage-studio = { path = "crates/apps/sillage-studio" }
sillage-daemon = { path = "crates/apps/sillage-daemon" }
sillage-governance = { path = "crates/kernel/sillage-governance" }
sillage-domain = { path = "crates/kernel/sillage-domain" }
sillage-ports = { path = "crates/kernel/sillage-ports" }
sillage-runtime = { path = "crates/runtime/sillage-runtime" }
sillage-blob-fs = { path = "crates/storage/sillage-blob-fs" }
sillage-search-tantivy = { path = "crates/storage/sillage-search-tantivy" }
sillage-sqlite-support = { path = "crates/storage/sillage-sqlite-support" }
sillage-storage-sqlite = { path = "crates/storage/sillage-storage-sqlite" }
sillage-vector-sqlite = { path = "crates/storage/sillage-vector-sqlite" }
sillage-graph-sqlite = { path = "crates/storage/sillage-graph-sqlite" }
sillage-memory = { path = "crates/ecosystem/sillage-memory" }
sillage-code-intel = { path = "crates/ecosystem/sillage-code-intel" }
sillage-parsers = { path = "crates/ecosystem/sillage-parsers" }
sillage-index-selection = { path = "crates/ecosystem/sillage-index-selection" }
sillage-validation = { path = "crates/ecosystem/sillage-validation" }
sillage-web-evidence = { path = "crates/ecosystem/sillage-web-evidence" }
sillage-retrieval = { path = "crates/ecosystem/sillage-retrieval" }
sillage-adapter-http = { path = "crates/ecosystem/sillage-adapter-http" }
sillage-ocr-local = { path = "crates/ecosystem/sillage-ocr-local" }
sillage-embedding-openai = { path = "crates/ecosystem/sillage-embedding-openai" }
sillage-visual-local = { path = "crates/ecosystem/sillage-visual-local" }
sillage-sparse-local = { path = "crates/ecosystem/sillage-sparse-local" }
sillage-harness = { path = "crates/harness/sillage-harness" }
sillage-harness-cli = { path = "crates/harness/sillage-harness-cli" }
sillage-test-support = { path = "crates/test-support/sillage-test-support" }
