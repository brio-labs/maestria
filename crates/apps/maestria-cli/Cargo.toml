[package]
name = "maestria-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
maestria-core = { path = "../../core/maestria-core" }
maestria-studio = { path = "../maestria-studio" }
maestria-daemon = { path = "../maestria-daemon" }
maestria-governance = { path = "../../kernel/maestria-governance" }
maestria-domain = { path = "../../kernel/maestria-domain" }
maestria-blob-fs = { path = "../../storage/maestria-blob-fs" }
maestria-storage-sqlite = { path = "../../storage/maestria-storage-sqlite" }
maestria-search-tantivy = { path = "../../storage/maestria-search-tantivy" }
maestria-ports = { path = "../../kernel/maestria-ports" }
maestria-parsers = { path = "../../ecosystem/maestria-parsers" }
maestria-code-intel = { path = "../../ecosystem/maestria-code-intel" }
maestria-retrieval = { path = "../../ecosystem/maestria-retrieval" }

tokio = { version = "1.37", features = ["full"] }
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
ignore = "0.4.28"
serde_json = "1.0"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
maestria-ports = { path = "../../kernel/maestria-ports", features = ["contract-tests"] }
maestria-retrieval = { path = "../../ecosystem/maestria-retrieval" }

