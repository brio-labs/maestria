[package]
name = "maestria-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
maestria-core = { workspace = true }
maestria-studio = { workspace = true }
maestria-daemon = { workspace = true }
maestria-governance = { workspace = true }
maestria-domain = { workspace = true }
maestria-blob-fs = { workspace = true }
maestria-storage-sqlite = { workspace = true }
maestria-search-tantivy = { workspace = true }
maestria-vector-sqlite = { workspace = true }
maestria-ports = { workspace = true }
maestria-parsers = { workspace = true }
maestria-index-selection = { workspace = true }
maestria-code-intel = { workspace = true }
maestria-retrieval = { workspace = true }

tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
rusqlite = { workspace = true }
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]
[dev-dependencies]
tempfile = { workspace = true }
maestria-ports = { workspace = true, features = ["contract-tests"] }
maestria-retrieval = { workspace = true }
maestria-test-support = { workspace = true }
