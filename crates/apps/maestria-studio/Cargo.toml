[package]
name = "maestria-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false


[dependencies]
agent-client-protocol = "1.0"
anyhow = "1.0"
maestria-core = { path = "../../core/maestria-core" }
maestria-daemon = { path = "../maestria-daemon" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rust-embed = "8.7"
tokio = { version = "1.37", features = ["fs", "io-util", "net", "process", "time"] }
