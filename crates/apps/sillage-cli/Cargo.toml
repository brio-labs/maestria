[package]
name = "sillage-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sillage-core = { workspace = true }
sillage-studio = { workspace = true }
sillage-daemon = { workspace = true }
sillage-governance = { workspace = true }
sillage-domain = { workspace = true }
sillage-blob-fs = { workspace = true }
sillage-storage-sqlite = { workspace = true }
sillage-search-tantivy = { workspace = true }
sillage-vector-sqlite = { workspace = true }
sillage-ports = { workspace = true }
sillage-parsers = { workspace = true }
sillage-index-selection = { workspace = true }
sillage-code-intel = { workspace = true }
sillage-retrieval = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
rusqlite = { workspace = true }
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]
[dev-dependencies]
tempfile = { workspace = true }
sillage-ports = { workspace = true, features = ["contract-tests"] }
sillage-retrieval = { workspace = true }
sillage-test-support = { workspace = true }
