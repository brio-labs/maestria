[package]
name = "maestria-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
libc = "0.2"
maestria-ports = { path = "../../kernel/maestria-ports" }
tokio = { version = "1.37", features = ["time", "io-util", "rt", "macros", "fs"] }


[dev-dependencies]
maestria-ports = { path = "../../kernel/maestria-ports", features = ["contract-tests"] }
tempfile = "3"
