[package]
name = "sillage-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
[dependencies]
sillage-domain = { workspace = true }
sillage-governance = { workspace = true }
sillage-memory = { workspace = true }
sillage-ports = { workspace = true }
sillage-validation = { workspace = true }
sillage-sqlite-support = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
sillage-ports = { workspace = true, features = ["contract-tests"] }
tokio-test = "0.4"
tracing-subscriber = { workspace = true }
parking_lot = "0.12"
sillage-search-tantivy = { workspace = true }
sillage-storage-sqlite = { workspace = true }
tempfile = { workspace = true }
sillage-test-support = { workspace = true }
