[package]
name = "maestria-studio-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "maestria-studio-web"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["web", "router"] }
gloo-net = "0.7.0"
pulldown-cmark = "0.13.4"
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"
web-sys = { version = "0.3.103", features = ["Document", "Element", "History", "HtmlDialogElement", "HtmlElement", "Location", "Storage", "Window"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
